<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <style>
    .box { fill: #1e1b2e; stroke: #4a4565; stroke-width: 1.5; rx: 12; }
    .box-purple { fill: #2d1f4e; stroke: #a855f7; stroke-width: 1.5; rx: 10; }
    .box-cyan { fill: #0f2f3a; stroke: #22d3ee; stroke-width: 1.5; rx: 10; }
    .box-green { fill: #1a2e1a; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
    .box-gray { fill: #1e1e2e; stroke: #64748b; stroke-width: 1.5; rx: 10; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #e2e8f0; }
    .label-sm { font-family: Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
    .label-lg { font-family: Arial, sans-serif; font-size: 15px; fill: #e2e8f0; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#0f0f1a" rx="16"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" class="label-lg">OMIX Agents — Architecture</text>

  <!-- Layer 1: Presentation -->
  <rect x="40" y="55" width="720" height="80" class="box"/>
  <text x="60" y="78" class="label-sm">PRESENTATION LAYER</text>
  <rect x="60" y="88" width="120" height="36" class="box-gray"/><text x="120" y="111" text-anchor="middle" class="label">ChatLayout</text>
  <rect x="200" y="88" width="100" height="36" class="box-gray"/><text x="250" y="111" text-anchor="middle" class="label">Sidebar</text>
  <rect x="320" y="88" width="100" height="36" class="box-gray"/><text x="370" y="111" text-anchor="middle" class="label">ChatPanel</text>
  <rect x="440" y="88" width="130" height="36" class="box-gray"/><text x="505" y="111" text-anchor="middle" class="label">StructuredCard</text>
  <rect x="590" y="88" width="120" height="36" class="box-gray"/><text x="650" y="111" text-anchor="middle" class="label">LLMToggle</text>

  <!-- Arrow 1->2 -->
  <line x1="400" y1="135" x2="400" y2="160" class="arrow"/>

  <!-- Layer 2: API -->
  <rect x="40" y="160" width="720" height="65" class="box"/>
  <text x="60" y="183" class="label-sm">API LAYER</text>
  <rect x="280" y="190" width="240" height="28" class="box-gray"/><text x="400" y="209" text-anchor="middle" class="label">POST /api/agent → route.ts</text>

  <!-- Arrow 2->3 -->
  <line x1="400" y1="225" x2="400" y2="255" class="arrow"/>

  <!-- Layer 3: Agents -->
  <rect x="40" y="255" width="720" height="95" class="box"/>
  <text x="60" y="278" class="label-sm">AGENT LAYER</text>
  <rect x="80" y="290" width="180" height="45" class="box-purple"/><text x="170" y="310" text-anchor="middle" class="label">Mix Design Agent</text><text x="170" y="325" text-anchor="middle" class="label-sm">lookup · compare · compliance</text>
  <rect x="310" y="290" width="180" height="45" class="box-cyan"/><text x="400" y="310" text-anchor="middle" class="label">Lab Ops Agent</text><text x="400" y="325" text-anchor="middle" class="label-sm">schedule · equipment · calibration</text>
  <rect x="540" y="290" width="180" height="45" class="box-green"/><text x="630" y="310" text-anchor="middle" class="label">QA/QC Agent</text><text x="630" y="325" text-anchor="middle" class="label-sm">validate · failures · summary</text>

  <!-- Query Layer (between agents and data) -->
  <rect x="280" y="360" width="240" height="28" class="box-gray"/><text x="400" y="379" text-anchor="middle" class="label">query.ts — filter · search · group</text>

  <!-- Arrows agents -> query -->
  <line x1="170" y1="335" x2="170" y2="374" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="170" y1="374" x2="280" y2="374" class="arrow"/>
  <line x1="400" y1="335" x2="400" y2="360" class="arrow"/>
  <line x1="630" y1="335" x2="630" y2="374" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="630" y1="374" x2="520" y2="374" stroke="#64748b" stroke-width="1.5" fill="none"/>

  <!-- Arrow query->data -->
  <line x1="400" y1="388" x2="400" y2="420" class="arrow"/>

  <!-- Layer 4: Data -->
  <rect x="40" y="420" width="720" height="65" class="box"/>
  <text x="60" y="443" class="label-sm">DATA LAYER (Synthetic JSON)</text>
  <rect x="120" y="450" width="150" height="28" class="box-gray"/><text x="195" y="469" text-anchor="middle" class="label">mixes.json (7)</text>
  <rect x="325" y="450" width="150" height="28" class="box-gray"/><text x="400" y="469" text-anchor="middle" class="label">tests.json (18)</text>
  <rect x="530" y="450" width="150" height="28" class="box-gray"/><text x="605" y="469" text-anchor="middle" class="label">assets.json (10)</text>
</svg>
